# Backend de Football Maestro en Render (Blueprint). Render lee este archivo al crear el servicio
# desde el repositorio. Los valores con "sync: false" son secretos o dependen del despliegue:
# Render los pide al crear el servicio y nunca se guardan en el repositorio.
services:
  - type: web
    name: football-maestro-api
    runtime: node
    plan: free
    # Ohio: la misma zona que la base de datos de Supabase (us-east-2), para responder más rápido.
    region: ohio
    rootDir: backend
    # Migraciones y datos iniciales (idempotentes) se aplican una vez por despliegue, en el build:
    # así el servidor arranca rápido cuando despierta (el plan gratis se apaga sin visitas).
    buildCommand: npm ci --include=dev && npm run build && npm run migration:run:prod && npm run seed:prod
    startCommand: npm run start:prod
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Vercel → proxy de Render → API: dos proxies delante (ver app.setup.ts).
      - key: TRUST_PROXY
        value: "2"
      # URL pública del frontend en Vercel, ej. https://football-maestro.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: APP_TIMEZONE
        value: America/Bogota
      # Supabase → Connect → Session pooler (puerto 5432; la conexión directa es solo IPv6).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      # Render genera una clave aleatoria larga.
      - key: JWT_SECRET
        generateValue: true
      # El frontend llama a la API por su mismo dominio (rewrite de Vercel): la cookie es del mismo sitio.
      - key: COOKIE_SAMESITE
        value: strict
      - key: NEWS_SYNC_MINUTES
        value: "120"
      # Opcionales: vacíos = sin Google, noticias de ejemplo y enlace de recuperación en los logs.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
