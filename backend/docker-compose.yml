# Base de datos local para desarrollo. Uso: npm run db:up
services:
  postgres:
    image: postgres:16-alpine
    container_name: football-maestro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-football_maestro}
      POSTGRES_USER: ${DB_USER:-football}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-football_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-football} -d ${DB_NAME:-football_maestro}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
